<template>
    <lightning-card title={title} icon-name="standard:opportunity">
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-var-p-around_large">
                <lightning-spinner alternative-text="Loading pipeline" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-var-m-around_medium" role="alert">
                <span>{error}</span>
            </div>
        </template>

        <template if:true={phases}>
            <div class="pipeline-strip slds-var-p-horizontal_medium slds-var-p-bottom_medium">
                <template for:each={phases} for:item="phase">
                    <div key={phase.label} class="phase-block">
                        <div class="phase-count slds-line-height_reset">{phase.count}</div>
                        <div class="phase-arrow"></div>
                        <div class="phase-label">{phase.label}</div>
                    </div>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
