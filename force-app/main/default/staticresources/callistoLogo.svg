<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Satellite orbiting a cratered moon, white for dark backgrounds</title>
<desc>Single-color white version of the orbit emblem for dark backgrounds and dark mode headers.</desc>

<defs>
<clipPath id="circleClipWhite">
<circle cx="340" cy="260" r="220"/>
</clipPath>
</defs>

<circle fill="none" stroke="#ffffff" stroke-width="3" cx="340" cy="260" r="222"/>

<g clip-path="url(#circleClipWhite)">

<g transform="translate(290,310)">
<circle fill="none" stroke="#ffffff" stroke-width="3" cx="0" cy="0" r="105"/>
<circle fill="#ffffff" cx="-35" cy="-50" r="22"/>
<circle fill="#ffffff" cx="40" cy="-20" r="14"/>
<circle fill="#ffffff" cx="-10" cy="40" r="30"/>
<circle fill="#ffffff" cx="55" cy="50" r="16"/>
<circle fill="#ffffff" cx="-65" cy="-10" r="12"/>
</g>

<ellipse fill="none" stroke="#ffffff" stroke-width="3" cx="340" cy="220" rx="230" ry="80" transform="rotate(-12 340 220)"/>

<g transform="translate(478,150) rotate(35)">
<rect fill="none" stroke="#ffffff" stroke-width="2" x="-70" y="-14" width="44" height="28" rx="2"/>
<rect fill="none" stroke="#ffffff" stroke-width="2" x="26" y="-14" width="44" height="28" rx="2"/>
<rect fill="#ffffff" x="-22" y="-20" width="44" height="40" rx="4"/>
<line x1="-26" y1="0" x2="-70" y2="0" stroke="#ffffff" stroke-width="2"/>
<line x1="26" y1="0" x2="70" y2="0" stroke="#ffffff" stroke-width="2"/>
</g>

</g>

<circle cx="340" cy="260" r="220" fill="none" stroke="#ffffff" stroke-width="3"/>
</svg>
